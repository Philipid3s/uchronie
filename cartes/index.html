<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes de l'uchronie</title>
<style>
  :root { --bg: #f6f2ea; --fg: #2b2620; --muted: #6f665a; --accent: #8a3b12; --line: #d9d0c1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a17; --fg: #ece5d8; --muted: #a59b8c; --accent: #e08a5a; --line: #3a352e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.7rem; margin: 0 0 .3rem; }
  p.sub { color: var(--muted); margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); padding: 14px 0; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  li span { display: block; color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>La Comète de juillet 1940</h1>
  <p class="sub">Cartes de la bible de l'uchronie</p>
  <ul>
    <li>
      <a href="carte-destructions.html">Cartes des destructions — juillet 1940</a>
      <span>Carte interactive en quatre onglets : impact de Rambouillet, impact du Pacifique, Méditerranée, Sardaigne</span>
    </li>
  </ul>
</main>
</body>
</html>
